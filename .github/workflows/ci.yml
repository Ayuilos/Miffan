name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Our own branches use the self-hosted runner; fork PRs never run on it.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","miffan"]') || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Android native toolchain
        # GitHub's runners ship sdkmanager under ANDROID_HOME without putting it on PATH.
        run: yes | "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'cmake;3.22.1' > /dev/null

      - name: Cache RDP native libraries
        id: rdp-native
        uses: actions/cache@v5
        with:
          path: rdp/build/native
          key: rdp-native-${{ runner.os }}-ndk28.2.13676358-8803dd26ec9660550252f255cf2d672a785ddd8f544bb475834993e96807c87f-603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a-${{ hashFiles('rdp/scripts/build-native.sh', 'rdp/scripts/fetch-sources.sh', 'rdp/scripts/patches/**') }}

      - name: Build pinned RDP native libraries
        if: steps.rdp-native.outputs.cache-hit != 'true'
        run: |
          rdp/scripts/fetch-sources.sh
          rdp/scripts/build-native.sh

      # Stream links the OpenSSL static archives prepared by RDP above.
      - name: Cache pinned stream source archives
        uses: actions/cache@v5
        with:
          path: |
            .deps/p6a/common-c.tar.gz
            .deps/p6a/common-c/enet.tar.gz
            .deps/p6a/common-c/nanors.tar.gz
          key: stream-sources-${{ runner.os }}-${{ hashFiles('stream/scripts/fetch-sources.sh') }}

      - name: Fetch and verify pinned stream sources
        run: stream/scripts/fetch-sources.sh

      - name: Verify remote helper safety
        run: |
          python3 remote-helper/tests/test_helper_safety.py
          python3 remote-helper/tests/test_sunshine_helper.py
          python3 remote-helper/tests/test_task_helper.py

      - name: Check remote helper shell diagnostics
        run: |
          archive="$RUNNER_TEMP/shellcheck-v0.10.0.linux.x86_64.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o "$archive"
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $archive" | sha256sum --check --strict
          tar -xf "$archive" -C "$RUNNER_TEMP"
          python3 remote-helper/tests/check_shellcheck.py "$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble debug APKs
        run: ./gradlew test lint assembleDebug --stacktrace
