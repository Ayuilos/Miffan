name: Publish connector to R2

on:
  workflow_run:
    workflows: ["Relay connector"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Connector release tag to mirror, e.g. relay-connector-v1.3.0 (leave empty for latest)
        required: false
        type: string
  pull_request:
    paths:
      - '.github/scripts/publish_connector_r2*'
      - '.github/workflows/publish-connector-r2.yml'

permissions:
  contents: read

concurrency:
  group: r2-connector-publish-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.draft == false && startsWith(github.event.release.tag_name, 'relay-connector-v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'relay-connector-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Test connector R2 validation and failure safety
        run: node --test .github/scripts/publish_connector_r2.test.mjs

  publish:
    needs: verify
    if: >-
      github.repository == 'Ayuilos/Miffan' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'relay-connector-v')) ||
      (github.event_name == 'release' && github.event.release.draft == false && startsWith(github.event.release.tag_name, 'relay-connector-v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Never execute code from an arbitrary release tag with deployment credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify runner tools
        run: |
          gh --version
          aws --version
          curl --version
      - name: Mirror and verify the published connector binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.release_tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MIFFAN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIFFAN_R2_SECRET_ACCESS_KEY }}
        run: node .github/scripts/publish_connector_r2.mjs
