<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1254"
  height="1254"
  viewBox="0 0 1254 1254"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Miffan rice bowl</title>
  <desc id="description">A warm terracotta bowl filled with rice on a pale blue background.</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#dceefa" />
      <stop offset="1" stop-color="#bcdaf2" />
    </radialGradient>
    <linearGradient id="bowlBody" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#d57450" />
      <stop offset="0.52" stop-color="#c76644" />
      <stop offset="1" stop-color="#b75a3d" />
    </linearGradient>
    <linearGradient id="bowlRim" x1="0.12" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#d97852" />
      <stop offset="0.58" stop-color="#cb6744" />
      <stop offset="1" stop-color="#ba5a3d" />
    </linearGradient>
    <radialGradient id="rice" cx="48%" cy="35%" r="78%">
      <stop offset="0" stop-color="#fff1bd" />
      <stop offset="1" stop-color="#f5d992" />
    </radialGradient>
  </defs>

  <rect width="1254" height="1254" fill="url(#background)" />

  <!-- Rounded bowl body. -->
  <path
    fill="url(#bowlBody)"
    d="M49 495
       C51 557 150 604 311 616
       C518 632 784 597 999 527
       C1125 486 1203 435 1215 373
       L1227 523
       C1237 785 1077 1030 834 1117
       C566 1214 283 1138 142 936
       C80 848 51 733 49 495Z"
  />

  <!-- Oversized elliptical rim. -->
  <path
    fill="url(#bowlRim)"
    d="M49 495
       C47 422 160 353 337 312
       C540 264 808 238 1005 249
       C1140 256 1207 300 1215 354
       C1225 423 1139 481 998 527
       C786 597 518 632 311 616
       C150 604 51 557 49 495Z"
  />

  <!-- One continuous, grain-free rice mound. -->
  <path
    fill="url(#rice)"
    d="M168 515
       C183 469 259 423 367 410
       C413 362 497 331 585 340
       C649 284 763 275 853 315
       C930 279 1039 296 1082 357
       C1071 407 978 456 829 495
       C628 548 378 565 222 543
       C187 538 169 528 168 515Z"
  />

  <!-- Minimal face, sharing the rice color family. -->
  <rect
    x="351"
    y="718"
    width="70"
    height="127"
    rx="35"
    fill="url(#rice)"
    transform="rotate(-4 386 781.5)"
  />
  <rect
    x="760"
    y="686"
    width="71"
    height="130"
    rx="35.5"
    fill="url(#rice)"
    transform="rotate(-4 795.5 751)"
  />
  <circle cx="590" cy="819" r="30" fill="url(#rice)" />
</svg>
