  role="img"
  aria-labelledby="title description"
>
  <title id="title">Miffan social preview</title>
  <desc id="description">Miffan icon and the tagline Your AI workspace on Android.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
