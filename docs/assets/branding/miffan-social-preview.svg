      <stop offset="1" stop-color="#bcdaf2" />
    </radialGradient>
    <linearGradient id="iconBowlBody" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#d57450" />
      <stop offset="0.52" stop-color="#c76644" />
      <stop offset="1" stop-color="#b75a3d" />
    </linearGradient>
    <linearGradient id="iconBowlRim" x1="0.12" y1="0" x2="0.82" y2="1">
