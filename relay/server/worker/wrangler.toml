# Miffan relay on Cloudflare Workers. Never run `wrangler deploy` from an agent; see ../README.md.
#
#   default environment  ->  Worker "miffan-relay"      on relay.miffan.ayuilos.me      (official instance)
#   --env dev            ->  Worker "miffan-relay-dev"  on relay-dev.miffan.ayuilos.me  (replaces the R0 prototype)
#
# `workers.dev` is not reachable from mainland China, so a custom domain is bound instead. Wrangler does not
# inherit bindings, variables or migrations into [env.dev], so they are repeated below.
#
# Secrets (never put them here):  wrangler secret put ACCESS_TOKEN   (only when accessMode is "token")
#                                 wrangler secret put ADMIN_TOKEN    (enables GET /v1/admin/stats)

name = "miffan-relay"
main = "index.ts"
compatibility_date = "2026-05-01"
workers_dev = false
routes = [{ pattern = "relay.miffan.ayuilos.me", custom_domain = true }]

[vars]
# Official instance on the Cloudflare free plan. Two Durable Object limits apply to the whole account:
#   - 13,000 GB-s a day, about 28 h of awake objects at 128 MB; globalDailyActiveHours keeps active time
#     to 60% of that (R0 measured far less billed time than wall-clock time, so this is conservative).
#   - 100,000 requests a day, where 20 received WebSocket messages count as one request and every
#     upgrade, alarm and RPC as one. A session whose output trickles in sends 80-90 frames/s, about
#     4 requests/s, so on busy days this limit is reached before the active-time one.
#     globalDailyRequests is the relay's own estimate of these requests; 60,000 leaves 40% for what it
#     cannot attribute to a host (refused or unauthenticated requests, the budget object's own alarm,
#     /v1/admin/stats). Media pauses at 70% of it (mediaReserve), new sessions stop at 100%.
# Bandwidth is free on Workers, so there are no traffic quotas.
RELAY_CONFIG = '''
{
  "accessMode": "open",
  "registrationsPerIpPerDay": 5,
  "policy": {
    "control": { "kbps": 1000, "burstKb": 2048 },
    "media": { "allowed": true, "kbps": 4000, "burstKb": 4096 },
    "limits": { "sessionsPerHost": 4, "idleTimeoutS": 300 },
    "quotas": { "hostDailyMb": 0, "hostDailyActiveMin": 60, "hostMonthlyControlMb": 0, "hostMonthlyMediaMb": 0 },
    "budget": { "globalDailyMb": 0, "globalDailyActiveHours": 17, "globalDailyRequests": 60000, "mediaReserve": 0.3 }
  },
  "edges": ["104.17.5.5", "104.19.8.8", "162.159.135.42", "104.18.32.47"]
}
'''

[[durable_objects.bindings]]
name = "RELAY"
class_name = "HostRelay"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

# Durable Objects must use SQLite storage (the only kind on the free plan).
# v1 is the tag the R0 prototype already applied on miffan-relay-dev; keep it so that deploy only adds v2.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Budget"]

# Keep our own console.log lines (hostId prefix and event names only), but not the per-request
# invocation logs: those carry request metadata (client address, location) for days, while PROTOCOL
# §6.3 allows source addresses to be kept for at most one day.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[env.dev]
name = "miffan-relay-dev"
workers_dev = false
routes = [{ pattern = "relay-dev.miffan.ayuilos.me", custom_domain = true }]

[env.dev.vars]
RELAY_CONFIG = '''
{
  "accessMode": "token",
  "registrationsPerIpPerDay": 5,
  "policy": {
    "control": { "kbps": 1000, "burstKb": 2048 },
    "media": { "allowed": true, "kbps": 4000, "burstKb": 4096 },
    "limits": { "sessionsPerHost": 4, "idleTimeoutS": 300 },
    "quotas": { "hostDailyMb": 500, "hostDailyActiveMin": 0, "hostMonthlyControlMb": 2048, "hostMonthlyMediaMb": 10240 },
    "budget": { "globalDailyMb": 0, "globalDailyActiveHours": 0, "mediaReserve": 0.3 }
  },
  "edges": ["104.17.5.5", "104.19.8.8", "162.159.135.42", "104.18.32.47"]
}
'''

[[env.dev.durable_objects.bindings]]
name = "RELAY"
class_name = "HostRelay"

[[env.dev.durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]

[[env.dev.migrations]]
tag = "v2"
new_sqlite_classes = ["Budget"]

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = false
